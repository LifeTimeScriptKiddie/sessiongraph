[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sessiongraph"
version = "0.1.0"
description = "Local-first coding-agent session loop and graph analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "LifeTimeScriptKiddie"}]
maintainers = [{name = "LifeTimeScriptKiddie"}]
keywords = ["coding-agent", "observability", "session-analysis", "local-first", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/LifeTimeScriptKiddie/sessiongraph"
Issues = "https://github.com/LifeTimeScriptKiddie/sessiongraph/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
sessiongraph = "sessiongraph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
